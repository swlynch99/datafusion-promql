[package]
name = "datafusion-promql"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "query-graph"
path = "src/bin/query-graph.rs"

[[bin]]
name = "query-plan"
path = "src/bin/query-plan.rs"
required-features = ["parquet"]

[[bin]]
name = "query-plot"
path = "src/bin/query-plot.rs"
required-features = ["plot"]

[[bin]]
name = "query-bench"
path = "src/bin/query-bench.rs"
required-features = ["parquet"]

[dependencies]
clap = { version = "4", features = ["derive"] }
smallvec = "1"
promql-parser = "0.8"
datafusion = "53"
arrow = { version = "58", features = ["prettyprint"] }
async-trait = "0.1"
thiserror = "2"
chrono = "0.4"
futures = "0.3"
regex = "1"
tokio = { version = "1", features = ["full"] }
parquet = { version = "58", optional = true }
object_store = { version = "0.13", optional = true }
bytes = { version = "1", optional = true }
histogram = { version = "1.3", optional = true }
textplots = { version = "0.8", optional = true }
rgb = { version = "0.8", optional = true }
terminal_size = { version = "0.4", optional = true }

[features]
parquet = ["datafusion/parquet", "dep:parquet", "dep:object_store", "dep:bytes"]
metriken = ["parquet", "dep:histogram"]
plot = ["parquet", "textplots", "rgb", "terminal_size"]

[dev-dependencies]
backtrace = "0.3.76"
ctor = "0.10.0"
libc = "0.2.185"
nix = { version = "0.31.2", features = ["signal"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
metriken-exposition = { path = "../metriken/metriken-exposition", features = ["parquet"] }
metriken = { path = "../metriken/metriken" }
histogram = "1.3"
